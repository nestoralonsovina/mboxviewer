name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build app
        run: bun run tauri build

      - name: Create DMG
        run: |
          APP_DIR="src-tauri/target/release/bundle/macos/mboxviewer.app"
          DMG="mboxviewer-${GITHUB_REF_NAME}.dmg"
          hdiutil create -volname "MBOX Viewer" -srcfolder "$APP_DIR" -ov -format UDZO "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG }}
          generate_release_notes: true
